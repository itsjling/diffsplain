name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Update Corepack
        run: npm install --global corepack@0.34.0
      - name: Enable the pinned pnpm version
        run: corepack enable
      - name: Install dependencies
        run: corepack pnpm run setup
      - name: Check docs
        run: corepack pnpm run docs:check
      - name: Build docs
        run: corepack pnpm run docs:build
      - name: Assemble site
        run: |
          mkdir -p _site/docs
          cp -R site/. _site/
          cp -R docs/dist/. _site/docs/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
