name: Changed-code Fallow audit (not full project health)

on:
  pull_request:

permissions:
  contents: read

jobs:
  changed-code-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Audit changed code (not full project health)
        uses: fallow-rs/fallow@v3
        with:
          command: audit
          fail-on-issues: true
