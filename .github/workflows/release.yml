name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact SemVer to publish (for example, 1.2.3 or 1.2.3-beta.1)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  release:
    name: Release exact version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Check out main with full history
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up pinned pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install Corepack and prepare npm
        run: |
          npm install --global corepack@0.34.1
          corepack enable
          COREPACK_ENABLE_PROJECT_SPEC=0 corepack npm@11.5.1 --version
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure the release commit author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Verify and publish the exact version
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-workflow.mjs "$RELEASE_VERSION"
